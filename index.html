<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirect</title>
<script>
  let variant = localStorage.getItem("ab-test");

  if (!variant) {
    variant = Math.random() < 0.5 ? "A" : "B";
    localStorage.setItem("ab-test", variant);
  }

  const base = window.location.origin + "/ab-test";

  if (variant === "A") {
    window.location.replace(base + "/ver1/index.html");
  } else {
    window.location.replace(base + "/ver2/index.html");
  }
</script>
</head>
<body>
</body>
</html>
